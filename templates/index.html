<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Dot Race</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 100, 0, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(120, 60, 200, 0.05) 0%, transparent 70%),
        linear-gradient(160deg, #0e0c17 0%, #060509 100%);
      background-attachment: fixed;
    }
    body {
      min-height: 100%;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 52px 16px 48px;
    }

    /* ── Header ── */
    .header-bar {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }
    .app-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
      background: linear-gradient(135deg, #ffe08a 0%, #ffb347 60%, #ff8c00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255, 160, 40, 0.35));
    }
    .add-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255, 128, 10, 0.15);
      border: 1px solid rgba(255, 128, 10, 0.30);
      cursor: pointer;
      color: rgb(255, 180, 60);
      font-size: 22px;
      font-weight: 300;
      line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 0 12px rgba(255, 128, 10, 0.15);
    }
    .add-btn:hover {
      background: rgba(255, 128, 10, 0.28);
      box-shadow: 0 0 20px rgba(255, 128, 10, 0.30);
      transform: scale(1.05);
    }

    /* ── Cards ── */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 128, 10, 0.20);
      border-radius: 24px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        0 1px 0 rgba(255, 255, 255, 0.05) inset,
        0 0 0 1px rgba(255, 128, 10, 0.08) inset;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 184, 72, 0.6);
      padding: 18px 18px 0;
    }

    /* ── Track canvas ── */
    #trackCard {
      padding: 0;
      border-color: rgba(255, 128, 10, 0.30);
      box-shadow:
        0 0 40px rgba(255, 100, 0, 0.12),
        0 8px 40px rgba(0, 0, 0, 0.6),
        0 1px 0 rgba(255, 255, 255, 0.05) inset;
      animation: trackCardPulse 4s ease-in-out infinite;
    }
    @keyframes trackCardPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(255, 100, 0, 0.10), 0 8px 40px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05) inset; }
      50%       { box-shadow: 0 0 55px rgba(255, 100, 0, 0.22), 0 8px 40px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05) inset; }
    }
    #trackCanvas {
      display: block;
      width: 100%;
      touch-action: none;
      cursor: grab;
      border-radius: 24px;
    }
    #trackCanvas.dragging { cursor: grabbing; }

    /* ── Racers card ── */
    #racersList { padding: 12px 0 14px; }
    .racer-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      margin: 0 10px 6px;
      border-radius: 14px;
      border-left: 3px solid transparent;
      position: relative;
      overflow: hidden;
    }
    .racer-row::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 14px;
      opacity: 0.08;
      pointer-events: none;
    }
    .dot-circle { border-radius: 50%; flex-shrink: 0; }
    .racer-info { flex: 1; min-width: 0; }
    .racer-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .racer-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .racer-pct  { font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .progress-bar-bg {
      height: 3px; background: rgba(255,255,255,0.10); border-radius: 2px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .empty-label { font-size: 14px; color: rgba(255,255,255,0.25); padding: 4px 18px 6px; }

    /* ── Side cards ── */
    .side-cards { display: flex; gap: 12px; margin-bottom: 14px; }
    .side-cards .card { flex: 1; margin-bottom: 0; }
    .side-body { padding: 10px 14px 16px; display: flex; flex-direction: column; gap: 7px; }
    .side-row { display: flex; align-items: center; gap: 9px; }
    .side-name {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.75);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── Manage card ── */
    #manageList { padding: 10px 0 4px; }
    .project-row {
      padding: 14px;
      margin: 0 10px 8px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 128, 10, 0.14);
      border-radius: 16px;
      transition: border-color 0.2s;
    }
    .project-row:hover { border-color: rgba(255, 128, 10, 0.28); }
    .row-main { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .name-input {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 8px;
      color: white; font-size: 15px; font-weight: 600;
      padding: 5px 9px;
      font-family: inherit;
      transition: all 0.15s;
    }
    .name-input:focus { outline: none; background: rgba(255,255,255,0.11); border-color: rgba(255, 128, 10, 0.45); }
    .row-pct { font-size: 13px; font-weight: 700; min-width: 34px; text-align: right; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255, 80, 80, 0.50); font-size: 13px; padding: 4px 2px;
      line-height: 1; transition: color 0.15s;
    }
    .delete-btn:hover { color: rgba(255, 80, 80, 0.90); }

    /* Lane segmented control */
    .lane-selector { display: flex; gap: 5px; }
    .lane-btn {
      flex: 1; padding: 6px 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.38);
      font-size: 11px; font-weight: 700; font-family: inherit;
      letter-spacing: 0.02em;
      cursor: pointer; transition: all 0.15s;
    }
    .lane-btn:hover { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.75); }
    .lane-btn.active {
      background: rgba(255, 128, 10, 0.20);
      border-color: rgba(255, 128, 10, 0.50);
      color: rgb(255, 184, 72);
      box-shadow: 0 0 10px rgba(255, 128, 10, 0.15);
    }

    /* Progress row */
    .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .progress-label { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: rgba(255, 184, 72, 0.55); white-space: nowrap; }
    .progress-slider { flex: 1; cursor: pointer; }
    .progress-val { font-size: 12px; font-weight: 700; min-width: 30px; text-align: right; }

    /* ── Add modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.70);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.20s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal {
      background: rgba(22, 18, 32, 0.95);
      border: 1px solid rgba(255, 128, 10, 0.30);
      border-radius: 22px; padding: 26px;
      width: min(320px, 88vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: rgb(255, 217, 140); margin-bottom: 16px; letter-spacing: -0.3px; }
    .modal-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 11px; color: white;
      font-size: 16px; font-family: inherit;
      padding: 11px 13px; margin-bottom: 18px;
      transition: border-color 0.15s;
    }
    .modal-input:focus { outline: none; border-color: rgba(255, 128, 10, 0.55); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-cancel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.55);
      border-radius: 11px; padding: 9px 18px;
      font-size: 15px; font-family: inherit; cursor: pointer;
      transition: all 0.15s;
    }
    .modal-cancel:hover { background: rgba(255,255,255,0.09); }
    .modal-add {
      background: linear-gradient(135deg, rgba(255, 140, 20, 0.35), rgba(255, 80, 0, 0.25));
      border: 1px solid rgba(255, 128, 10, 0.50);
      color: rgb(255, 200, 80);
      border-radius: 11px; padding: 9px 20px;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 128, 10, 0.20);
      transition: all 0.15s;
    }
    .modal-add:hover { box-shadow: 0 0 24px rgba(255, 128, 10, 0.35); transform: translateY(-1px); }
  </style>
</head>
<body>
<div id="app">
  <div class="header-bar">
    <span class="app-title">Project Dot Race</span>
    <button class="add-btn" id="addBtn">+</button>
  </div>

  <div class="card" id="trackCard">
    <canvas id="trackCanvas"></canvas>
  </div>

  <div class="card">
    <div class="card-title">Racers</div>
    <div id="racersList"></div>
  </div>

  <div class="side-cards">
    <div class="card">
      <div class="card-title">Bullpen</div>
      <div class="side-body" id="bullpenList"></div>
    </div>
    <div class="card">
      <div class="card-title">Retired</div>
      <div class="side-body" id="retiredList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Manage</div>
    <div id="manageList"></div>
  </div>
</div>

<!-- Add modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">New Project</div>
    <input class="modal-input" id="newProjectName" type="text" placeholder="Project name" autocomplete="off" autocorrect="off">
    <div class="modal-actions">
      <button class="modal-cancel" id="cancelAdd">Cancel</button>
      <button class="modal-add" id="confirmAdd">Add</button>
    </div>
  </div>
</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let projects = [];
let dotLanePos = {};
let drag = null;

// ─── API ────────────────────────────────────────────────────────────────────
const api = {
  async list()          { return (await fetch('/api/projects')).json(); },
  async add(name)       { return (await fetch('/api/projects', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name}) })).json(); },
  async patch(id, data) { return (await fetch(`/api/projects/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) })).json(); },
  async del(id)         { await fetch(`/api/projects/${id}`, { method:'DELETE' }); },
};

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('trackCanvas');
const ctx    = canvas.getContext('2d');
const TRACK_H = 230;
const DPR     = window.devicePixelRatio || 1;
let W = 0;

function resizeCanvas() {
  const newW = canvas.parentElement.clientWidth;
  if (newW === W) return;
  W = newW;
  canvas.width  = W * DPR;
  canvas.height = TRACK_H * DPR;
  canvas.style.height = TRACK_H + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(DPR, DPR);
  render();
}

// ─── Geometry ────────────────────────────────────────────────────────────────
function geo() {
  const M  = 10;
  const ox = M, oy = M, ow = W - 2*M, oh = TRACK_H - 2*M;
  return {
    outer:   { x: ox,    y: oy,    w: ow,     h: oh     },
    inner:   { x: ox+28, y: oy+28, w: ow-56,  h: oh-56  },
    mid:     { x: ox+14, y: oy+14, w: ow-28,  h: oh-28  },
    infield: { x: ox+54, y: oy+42, w: ow-108, h: oh-84  },
    cx: ox + ow/2,
    cy: oy + oh/2,
  };
}

function capsulePath(r) {
  const rad = r.h / 2;
  ctx.beginPath();
  ctx.moveTo(r.x + rad, r.y);
  ctx.lineTo(r.x + r.w - rad, r.y);
  ctx.arc(r.x + r.w - rad, r.y + rad, rad, -Math.PI/2, Math.PI/2);
  ctx.lineTo(r.x + rad, r.y + r.h);
  ctx.arc(r.x + rad, r.y + rad, rad, Math.PI/2, -Math.PI/2);
  ctx.closePath();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.arc(x+w-r, y+r, r, -Math.PI/2, Math.PI/2);
  ctx.lineTo(x+r, y+h);
  ctx.arc(x+r, y+r, r, Math.PI/2, -Math.PI/2);
  ctx.closePath();
}

function pointOnTrack(progress, lane, g) {
  const DS = 6.5;
  const angle  = -(progress * Math.PI * 2) - Math.PI/2;
  const outerA = g.outer.w/2 - DS,  outerB = g.outer.h/2 - DS;
  const innerA = g.inner.w/2 + DS,  innerB = g.inner.h/2 + DS;
  const a = outerA - (outerA - innerA) * lane;
  const b = outerB - (outerB - innerB) * lane;
  return { x: g.cx + Math.cos(angle)*a, y: g.cy + Math.sin(angle)*b };
}

function angleToProgress(px, py, g) {
  const angle = Math.atan2(py - g.cy, px - g.cx);
  const p = -(angle + Math.PI/2) / (Math.PI*2);
  return p < 0 ? p + 1 : p;
}

function laneValueFor(px, py, g) {
  const outerA = g.outer.w/2, outerB = g.outer.h/2;
  const innerA = g.inner.w/2, innerB = g.inner.h/2;
  const dx = Math.abs(px - g.cx), dy = Math.abs(py - g.cy);
  const on = Math.max(dx/outerA, dy/outerB);
  const inn = Math.max(dx/innerA, dy/innerB);
  return Math.min(Math.max((on - inn) + 0.5, 0.05), 0.95);
}

function inInfield(px, py, g) {
  const f = g.infield;
  return px >= f.x && px <= f.x+f.w && py >= f.y && py <= f.y+f.h;
}

function bullpenHalf(g) {
  const f = g.infield;
  return { x: f.x, y: f.y, w: (f.w-1)/2, h: f.h };
}
function retiredHalf(g) {
  const f = g.infield, hw = (f.w-1)/2;
  return { x: f.x+hw+1, y: f.y, w: hw, h: f.h };
}

function infieldPos(index, frame) {
  const DS = 11, step = DS + 3;
  const cols = Math.max(1, Math.floor((frame.w - 10) / step));
  return {
    x: frame.x + 7 + (index % cols)*step + DS/2,
    y: frame.y + 20 + Math.floor(index/cols)*step + DS/2,
  };
}

function dist(x1, y1, x2, y2) { return Math.hypot(x2-x1, y2-y1); }

// ─── Drawing ─────────────────────────────────────────────────────────────────
function render() {
  if (!W) return;
  ctx.clearRect(0, 0, W, TRACK_H);
  const g = geo();
  drawTrack(g);
  drawStartFinish(g);
  drawInfieldLabels(g);
  drawInfieldDots(g);
  drawTrackDots(g);
}

function drawTrack(g) {
  // Base fills
  ctx.save();
  capsulePath(g.outer);
  ctx.fillStyle = 'rgb(14, 11, 10)';
  ctx.fill();
  capsulePath(g.inner);
  ctx.fillStyle = 'rgb(8, 7, 11)';
  ctx.fill();
  ctx.restore();

  // Subtle mid-track center line
  ctx.save();
  ctx.shadowColor = 'rgba(255, 120, 0, 0.5)';
  ctx.shadowBlur  = 10;
  capsulePath(g.mid);
  ctx.strokeStyle = 'rgba(255, 130, 10, 0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  // Outer + inner glow edges — double-pass for richer glow
  for (const rect of [g.outer, g.inner]) {
    ctx.save();
    ctx.shadowColor = 'rgba(255, 90, 0, 0.60)';
    ctx.shadowBlur  = 18;
    capsulePath(rect);
    ctx.strokeStyle = 'rgba(255, 140, 15, 0.85)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.shadowColor = 'rgba(255, 60, 0, 0.25)';
    ctx.shadowBlur  = 36;
    capsulePath(rect);
    ctx.strokeStyle = 'transparent';
    ctx.stroke();
    ctx.restore();
  }
}

function drawStartFinish(g) {
  const topY = g.outer.y, innerTopY = g.inner.y;
  const h = innerTopY - topY, midY = (topY + innerTopY) / 2;
  const cx = g.cx;

  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(cx - 7, topY, 3, h);

  const cellW = 4, rows = Math.max(4, Math.floor(h / cellW));
  const cellH = h / rows;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < 2; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? 'rgba(255,255,255,0.95)' : 'rgba(0,0,0,0.95)';
      ctx.fillRect(cx + 3 + col*cellW, topY + row*cellH, cellW, cellH);
    }
  }
  drawPill('S', cx - 20, midY);
  drawPill('F', cx + 20, midY);
  ctx.restore();
}

function drawPill(label, cx, cy) {
  ctx.font = '700 7px -apple-system, sans-serif';
  const tw = ctx.measureText(label).width;
  const pw = tw + 8, ph = 14;
  roundRectPath(cx - pw/2, cy - ph/2, pw, ph, ph/2);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy);
}

function drawInfieldLabels(g) {
  const f = g.infield;
  ctx.save();
  ctx.font = '700 9px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('BULLPEN', f.x + 8, f.y + 8);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(f.x + f.w/2, f.y + 6, 1, f.h - 12);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('RETIRED', f.x + f.w/2 + 8, f.y + 8);
  ctx.restore();
}

function drawInfieldDots(g) {
  const bh = bullpenHalf(g), rh = retiredHalf(g);
  projects.filter(p => p.lane === 'bullpen').slice(0, 8).forEach((p, i) => {
    const isDrag = drag && drag.id === p.id;
    const pos = isDrag ? drag : infieldPos(i, bh);
    drawDot(pos.x, pos.y, 11, p.colorHex, isDrag, false);
  });
  projects.filter(p => p.lane === 'retired').slice(0, 8).forEach((p, i) => {
    const isDrag = drag && drag.id === p.id;
    const pos = isDrag ? drag : infieldPos(i, rh);
    drawDot(pos.x, pos.y, 11, p.colorHex, isDrag, false);
  });
}

function drawTrackDots(g) {
  const racing = projects.filter(p => p.lane === 'racing');
  racing.forEach((p, i) => {
    const def  = racing.length <= 1 ? 0.5 : 0.2 + i/(racing.length-1)*0.6;
    const lane = dotLanePos[p.id] !== undefined ? dotLanePos[p.id] : def;
    const isDrag = drag && drag.id === p.id;
    const pos = isDrag ? drag : pointOnTrack(p.progress, lane, g);
    drawDot(pos.x, pos.y, 14, p.colorHex, isDrag, true);
  });
}

function drawDot(x, y, diameter, hex, isDragging, outline) {
  const r = (diameter / 2) * (isDragging ? 1.4 : 1.0);
  ctx.save();
  // Outer diffuse glow
  ctx.shadowColor = hex;
  ctx.shadowBlur  = isDragging ? 22 : (outline ? 14 : 10);
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = hex;
  ctx.fill();
  // Crisp outline
  ctx.shadowBlur = 0;
  ctx.strokeStyle = outline ? 'rgba(255,255,255,0.90)' : 'rgba(255,255,255,0.65)';
  ctx.lineWidth   = outline ? 2 : 1.5;
  ctx.stroke();
  // Inner highlight
  ctx.beginPath();
  ctx.arc(x - r*0.2, y - r*0.25, r * 0.38, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.fill();
  ctx.restore();
}

// ─── Hit testing ─────────────────────────────────────────────────────────────
function findDotAt(px, py) {
  const g = geo();
  const racing  = projects.filter(p => p.lane === 'racing');
  const bullpen = projects.filter(p => p.lane === 'bullpen');
  const retired  = projects.filter(p => p.lane === 'retired');

  for (let i = 0; i < racing.length; i++) {
    const p = racing[i];
    const def  = racing.length <= 1 ? 0.5 : 0.2 + i/(racing.length-1)*0.6;
    const lane = dotLanePos[p.id] !== undefined ? dotLanePos[p.id] : def;
    const pos  = pointOnTrack(p.progress, lane, g);
    if (dist(px, py, pos.x, pos.y) < 18) return { project: p, type: 'track', lane };
  }
  const bh = bullpenHalf(g), rh = retiredHalf(g);
  for (let i = 0; i < bullpen.length && i < 8; i++) {
    if (dist(px, py, ...Object.values(infieldPos(i, bh))) < 14) return { project: bullpen[i], type: 'infield' };
  }
  for (let i = 0; i < retired.length && i < 8; i++) {
    if (dist(px, py, ...Object.values(infieldPos(i, rh))) < 14) return { project: retired[i], type: 'infield' };
  }
  return null;
}

// ─── Drag ────────────────────────────────────────────────────────────────────
function evPos(e) {
  const rect = canvas.getBoundingClientRect();
  const src = (e.changedTouches || e.touches || [])[0] || e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

canvas.addEventListener('mousedown',  onDragStart);
canvas.addEventListener('touchstart', onDragStart, { passive: false });

function onDragStart(e) {
  e.preventDefault();
  const { x, y } = evPos(e);
  const hit = findDotAt(x, y);
  if (!hit) return;
  drag = { id: hit.project.id, type: hit.type, x, y, lane: hit.lane };
  canvas.classList.add('dragging');
  render();
}

window.addEventListener('mousemove',  onDragMove);
window.addEventListener('touchmove',  onDragMove, { passive: false });

function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const { x, y } = evPos(e);
  drag.x = x; drag.y = y;
  if (drag.type === 'track') {
    const g = geo();
    if (!inInfield(x, y, g)) {
      const p = projects.find(p => p.id === drag.id);
      if (p) {
        p.progress = angleToProgress(x, y, g);
        dotLanePos[drag.id] = laneValueFor(x, y, g);
      }
    }
  }
  render();
}

window.addEventListener('mouseup',  onDragEnd);
window.addEventListener('touchend', onDragEnd);

async function onDragEnd(e) {
  if (!drag) return;
  const { x, y } = evPos(e);
  const id = drag.id, type = drag.type;
  drag = null;
  canvas.classList.remove('dragging');

  const g = geo();
  const inside = inInfield(x, y, g);

  if (type === 'track') {
    if (inside) {
      await api.patch(id, { lane: x < g.infield.x + g.infield.w/2 ? 'bullpen' : 'retired' });
    } else {
      dotLanePos[id] = laneValueFor(x, y, g);
      await api.patch(id, { progress: angleToProgress(x, y, g) });
    }
  } else {
    if (!inside) {
      dotLanePos[id] = laneValueFor(x, y, g);
      await api.patch(id, { lane: 'racing', progress: angleToProgress(x, y, g) });
    } else {
      await api.patch(id, { lane: x < g.infield.x + g.infield.w/2 ? 'bullpen' : 'retired' });
    }
  }
  await refresh();
}

// ─── Cards ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function renderCards() {
  const racing  = projects.filter(p => p.lane === 'racing');
  const bullpen = projects.filter(p => p.lane === 'bullpen');
  const retired  = projects.filter(p => p.lane === 'retired');

  // Racers — color-tinted rows with progress bars
  document.getElementById('racersList').innerHTML = racing.length === 0
    ? '<div class="empty-label">No projects racing</div>'
    : racing.map(p => `
        <div class="racer-row" style="
          border-left-color: ${p.colorHex};
          background: linear-gradient(90deg, ${hexToRgba(p.colorHex, 0.10)} 0%, ${hexToRgba(p.colorHex, 0.03)} 60%, transparent 100%);
        ">
          <div class="dot-circle" style="width:12px;height:12px;background:${p.colorHex};box-shadow:0 0 10px ${hexToRgba(p.colorHex,0.7)}"></div>
          <div class="racer-info">
            <div class="racer-header">
              <span class="racer-name">${esc(p.name)}</span>
              <span class="racer-pct" style="color:${p.colorHex}">${Math.round(p.progress*100)}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width:${Math.round(p.progress*100)}%;background:linear-gradient(90deg,${p.colorHex},${hexToRgba(p.colorHex,0.6)})"></div>
            </div>
          </div>
        </div>`).join('');

  // Side cards — glowing dots
  document.getElementById('bullpenList').innerHTML = bullpen.length === 0
    ? '<span style="color:rgba(255,255,255,0.25);font-size:13px">Empty</span>'
    : bullpen.map(p => `
        <div class="side-row">
          <div class="dot-circle" style="width:9px;height:9px;background:${p.colorHex};box-shadow:0 0 8px ${hexToRgba(p.colorHex,0.7)};flex-shrink:0"></div>
          <span class="side-name">${esc(p.name)}</span>
        </div>`).join('');

  document.getElementById('retiredList').innerHTML = retired.length === 0
    ? '<span style="color:rgba(255,255,255,0.25);font-size:13px">Empty</span>'
    : retired.map(p => `
        <div class="side-row">
          <div class="dot-circle" style="width:9px;height:9px;background:${p.colorHex};box-shadow:0 0 8px ${hexToRgba(p.colorHex,0.7)};flex-shrink:0;opacity:0.55"></div>
          <span class="side-name" style="opacity:0.6">${esc(p.name)}</span>
        </div>`).join('');

  // Manage
  const ml = document.getElementById('manageList');
  ml.innerHTML = projects.map(p => `
    <div class="project-row">
      <div class="row-main">
        <div class="dot-circle" style="width:13px;height:13px;background:${p.colorHex};box-shadow:0 0 10px ${hexToRgba(p.colorHex,0.6)};flex-shrink:0"></div>
        <input class="name-input" value="${esc(p.name)}" data-id="${p.id}">
        ${p.lane === 'racing'
          ? `<span class="row-pct" style="color:${p.colorHex}">${Math.round(p.progress*100)}%</span>`
          : '<span class="row-pct"></span>'}
        <button class="delete-btn" data-id="${p.id}" title="Delete">✕</button>
      </div>
      <div class="lane-selector">
        ${['bullpen','racing','retired'].map(l =>
          `<button class="lane-btn${p.lane===l?' active':''}" data-id="${p.id}" data-lane="${l}">${l.charAt(0).toUpperCase()+l.slice(1)}</button>`
        ).join('')}
      </div>
      ${p.lane === 'racing' ? `
      <div class="progress-row">
        <span class="progress-label">Progress</span>
        <input type="range" class="progress-slider" min="0" max="100"
               value="${Math.round(p.progress*100)}" data-id="${p.id}"
               style="accent-color:${p.colorHex}">
        <span class="progress-val" style="color:${p.colorHex}">${Math.round(p.progress*100)}%</span>
      </div>` : ''}
    </div>`).join('');

  ml.querySelectorAll('.delete-btn').forEach(btn =>
    btn.addEventListener('click', async () => { await api.del(btn.dataset.id); await refresh(); })
  );
  ml.querySelectorAll('.name-input').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
    inp.addEventListener('blur', async () => { await api.patch(inp.dataset.id, { name: inp.value }); await refresh(); });
  });
  ml.querySelectorAll('.lane-btn').forEach(btn =>
    btn.addEventListener('click', async () => { await api.patch(btn.dataset.id, { lane: btn.dataset.lane }); await refresh(); })
  );
  ml.querySelectorAll('.progress-slider').forEach(slider => {
    slider.addEventListener('input', () => {
      const pct = parseInt(slider.value);
      const row = slider.closest('.project-row');
      row.querySelector('.progress-val').textContent = pct + '%';
      const pctEl = row.querySelector('.row-pct');
      if (pctEl) pctEl.textContent = pct + '%';
      const p = projects.find(p => p.id === slider.dataset.id);
      if (p) { p.progress = pct/100; render(); }
    });
    slider.addEventListener('change', async () => {
      await api.patch(slider.dataset.id, { progress: parseInt(slider.value)/100 });
      await refresh();
    });
  });
}

// ─── Modal ───────────────────────────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', () => {
  document.getElementById('addModal').classList.add('visible');
  document.getElementById('newProjectName').focus();
});
document.getElementById('cancelAdd').addEventListener('click', closeModal);
document.getElementById('addModal').addEventListener('click', e => {
  if (e.target === document.getElementById('addModal')) closeModal();
});
document.getElementById('newProjectName').addEventListener('keydown', e => {
  if (e.key === 'Enter')  document.getElementById('confirmAdd').click();
  if (e.key === 'Escape') closeModal();
});
document.getElementById('confirmAdd').addEventListener('click', async () => {
  const name = document.getElementById('newProjectName').value.trim();
  await api.add(name || '');
  closeModal();
  await refresh();
});
function closeModal() {
  document.getElementById('addModal').classList.remove('visible');
  document.getElementById('newProjectName').value = '';
}

// ─── Boot ────────────────────────────────────────────────────────────────────
async function refresh() {
  projects = await api.list();
  renderCards();
  render();
}

(async () => {
  await refresh();
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); render(); });
})();
</script>
</body>
</html>
