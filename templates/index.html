<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Dot Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 16px 52px;
    }

    /* ── Header ────────────────────────────────────────────────── */
    .header-bar {
      display: flex;
      align-items: flex-start;
      margin-bottom: 22px;
      padding: 0 2px;
    }
    .header-text { flex: 1; }

    .title-project-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 0;
    }
    .title-line {
      height: 1.5px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(200,145,30,0.55));
    }
    .title-line.right {
      background: linear-gradient(90deg, rgba(200,145,30,0.55), transparent);
    }
    .title-project-text {
      font-family: 'Rajdhani', 'Bebas Neue', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.38em;
      color: #c8973a;
      font-style: italic;
    }

    .title-dot-race {
      font-family: 'Bebas Neue', Impact, 'Arial Black', sans-serif;
      font-size: 82px;
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 0.88;
      background: linear-gradient(170deg,
        #fffad0 0%,
        #f5d060 14%,
        #c88a10 32%,
        #f0b835 48%,
        #7c4e00 58%,
        #d09820 68%,
        #fff4a0 84%,
        #c88a10 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 12px rgba(180,120,10,0.50))
              drop-shadow(0 1px 2px rgba(0,0,0,0.9));
    }

    .app-subtitle {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.20em;
      color: rgba(255,255,255,0.28);
      margin-top: 7px;
    }

    .add-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      cursor: pointer;
      color: rgba(255,255,255,0.70);
      font-size: 26px;
      font-weight: 200;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 10px;
      transition: all 0.2s;
      line-height: 1;
    }
    .add-btn:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.25); }

    /* ── Cards ─────────────────────────────────────────────────── */
    .card {
      background: #0f0e0d;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 16px 18px 12px;
    }
    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .racers-accent  { color: #c8973a; }
    .bullpen-accent { color: #c05040; }
    .retired-accent { color: #9a8050; }
    .manage-accent  { color: #c8973a; }

    /* ── Track ──────────────────────────────────────────────────── */
    .track-card {
      padding: 0;
      border-color: rgba(200,140,25,0.30);
      background: #080706;
      box-shadow:
        0 0 50px rgba(180,100,10,0.14),
        inset 0 0 80px rgba(160,90,8,0.07);
    }
    #trackCanvas {
      display: block;
      width: 100%;
      touch-action: none;
      cursor: grab;
      border-radius: 20px;
    }
    #trackCanvas.dragging { cursor: grabbing; }

    /* ── Racers ─────────────────────────────────────────────────── */
    #racersList { padding: 0 12px 14px; }
    .racer-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 16px;
      background: #171512;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .racer-dot { border-radius: 50%; flex-shrink: 0; }
    .racer-body { flex: 1; min-width: 0; }
    .racer-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .racer-name { font-size: 19px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
    .racer-pct  { font-size: 18px; font-weight: 700; flex-shrink: 0; }
    .racer-chev { color: rgba(255,255,255,0.22); font-size: 17px; flex-shrink: 0; }
    .prog-bar-bg   { height: 4px; background: rgba(255,255,255,0.10); border-radius: 3px; overflow: hidden; }
    .prog-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
    .empty-label { font-size: 14px; color: rgba(255,255,255,0.22); padding: 4px 0 6px; }

    /* ── Side cards ─────────────────────────────────────────────── */
    .side-cards { display: flex; gap: 12px; margin-bottom: 14px; }
    .side-cards .card { flex: 1; margin-bottom: 0; }
    .bullpen-card { border-color: rgba(180,60,50,0.32); background: #100b0a; }
    .retired-card { border-color: rgba(160,110,20,0.28); background: #0e0d09; }

    .side-body { padding: 0 0 6px; }
    .side-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .side-item:last-child { border-bottom: none; }
    .side-dot { border-radius: 50%; flex-shrink: 0; }
    .side-name { flex: 1; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.80); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side-chev { color: rgba(255,255,255,0.20); font-size: 14px; flex-shrink: 0; }

    /* ── Manage ─────────────────────────────────────────────────── */
    .manage-body { padding: 4px 12px 12px; }
    .project-row {
      padding: 14px 16px;
      background: #171512;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .row-top { display: flex; align-items: center; gap: 13px; margin-bottom: 12px; }
    .manage-dot { border-radius: 50%; flex-shrink: 0; }
    .name-input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 19px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: -0.2px;
      padding: 0;
    }
    .name-input:focus { outline: none; }
    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.22);
      font-size: 18px; line-height: 1; padding: 2px 0;
      transition: color 0.15s;
    }
    .delete-btn:hover { color: rgba(255, 75, 75, 0.85); }

    /* Lane buttons */
    .lane-selector { display: flex; gap: 8px; }
    .lane-btn {
      flex: 1; padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.35);
      font-size: 12px; font-weight: 600; font-family: inherit;
      letter-spacing: 0.03em;
      cursor: pointer; transition: all 0.18s;
    }
    .lane-btn:hover:not(.active) { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.65); }

    /* Progress slider */
    .prog-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .prog-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: rgba(200,155,50,0.45); white-space: nowrap; }
    .prog-slider { flex: 1; cursor: pointer; }
    .prog-val { font-size: 12px; font-weight: 700; min-width: 30px; text-align: right; }

    /* ── Modal ──────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .modal {
      background: #141210;
      border: 1px solid rgba(200,150,30,0.30);
      border-radius: 22px; padding: 26px;
      width: min(320px, 88vw);
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }
    .modal-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 0.08em;
      color: #e8c060;
      margin-bottom: 16px;
    }
    .modal-input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 11px; color: white;
      font-size: 16px; font-family: inherit;
      padding: 12px 14px; margin-bottom: 18px;
    }
    .modal-input:focus { outline: none; border-color: rgba(200,150,30,0.55); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-cancel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.50);
      border-radius: 11px; padding: 10px 18px;
      font-size: 15px; font-family: inherit; cursor: pointer;
    }
    .modal-cancel:hover { background: rgba(255,255,255,0.09); }
    .modal-add {
      background: rgba(200,150,25,0.25);
      border: 1px solid rgba(200,150,25,0.52);
      color: #f0c055;
      border-radius: 11px; padding: 10px 20px;
      font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: background 0.15s;
    }
    .modal-add:hover { background: rgba(200,150,25,0.40); }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="header-bar">
    <div class="header-text">
      <div class="title-project-row">
        <div class="title-line"></div>
        <span class="title-project-text">PROJECT</span>
        <div class="title-line right"></div>
      </div>
      <div class="title-dot-race">DOT RACE</div>
      <p class="app-subtitle">TRACK PROGRESS. DRIVE RESULTS.</p>
    </div>
    <button class="add-btn" id="addBtn">+</button>
  </div>

  <!-- Track -->
  <div class="card track-card">
    <canvas id="trackCanvas"></canvas>
  </div>

  <!-- Racers -->
  <div class="card">
    <div class="section-header">
      <svg class="racers-accent" width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      <span class="section-label racers-accent">RACERS</span>
    </div>
    <div id="racersList"></div>
  </div>

  <!-- Bullpen + Retired -->
  <div class="side-cards">
    <div class="card bullpen-card">
      <div class="section-header">
        <svg class="bullpen-accent" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M14.4 6L14 4H5v17h2v-7h5.6l.4 2h7V6z"/>
        </svg>
        <span class="section-label bullpen-accent">BULLPEN</span>
      </div>
      <div class="side-body" id="bullpenList"></div>
    </div>
    <div class="card retired-card">
      <div class="section-header">
        <svg class="retired-accent" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12 .94 1H5.12z"/>
        </svg>
        <span class="section-label retired-accent">RETIRED</span>
      </div>
      <div class="side-body" id="retiredList"></div>
    </div>
  </div>

  <!-- Manage -->
  <div class="card">
    <div class="section-header">
      <svg class="manage-accent" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
      </svg>
      <span class="section-label manage-accent">MANAGE</span>
    </div>
    <div class="manage-body" id="manageList"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-title">NEW PROJECT</div>
    <input class="modal-input" id="newProjectName" type="text" placeholder="Project name" autocomplete="off" autocorrect="off">
    <div class="modal-actions">
      <button class="modal-cancel" id="cancelAdd">Cancel</button>
      <button class="modal-add" id="confirmAdd">Add</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let projects = [];
let dotLanePos = {};
let drag = null;

// ─── API ─────────────────────────────────────────────────────────────────────
const api = {
  async list()          { return (await fetch('/api/projects')).json(); },
  async add(name)       { return (await fetch('/api/projects', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name}) })).json(); },
  async patch(id, data) { return (await fetch(`/api/projects/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) })).json(); },
  async del(id)         { await fetch(`/api/projects/${id}`, { method:'DELETE' }); },
};

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('trackCanvas');
const ctx    = canvas.getContext('2d');
const TRACK_H = 350;
const DPR     = window.devicePixelRatio || 1;
let W = 0;

function resizeCanvas() {
  const newW = canvas.parentElement.clientWidth;
  if (newW === W) return;
  W = newW;
  canvas.width  = W * DPR;
  canvas.height = TRACK_H * DPR;
  canvas.style.height = TRACK_H + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(DPR, DPR);
  render();
}

// ─── Geometry ────────────────────────────────────────────────────────────────
function geo() {
  const M = 10;
  const outer   = { x: M,      y: M,      w: W-2*M,       h: TRACK_H-2*M       };
  const ring2   = { x: M+26,   y: M+26,   w: W-2*(M+26),  h: TRACK_H-2*(M+26)  };
  const inner   = { x: M+52,   y: M+52,   w: W-2*(M+52),  h: TRACK_H-2*(M+52)  };
  const infield = { x: M+68,   y: M+60,   w: W-2*(M+68),  h: TRACK_H-2*(M+60)  };
  return { outer, ring2, inner, infield, cx: W/2, cy: TRACK_H/2 };
}

function capsulePath(r) {
  const rad = r.h / 2;
  ctx.beginPath();
  ctx.moveTo(r.x+rad, r.y);
  ctx.lineTo(r.x+r.w-rad, r.y);
  ctx.arc(r.x+r.w-rad, r.y+rad, rad, -Math.PI/2, Math.PI/2);
  ctx.lineTo(r.x+rad, r.y+r.h);
  ctx.arc(r.x+rad, r.y+rad, rad, Math.PI/2, -Math.PI/2);
  ctx.closePath();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);
  ctx.lineTo(x+r,y+h);
  ctx.arc(x+r,y+r,r,Math.PI/2,-Math.PI/2);
  ctx.closePath();
}

function pointOnTrack(progress, lane, g) {
  const DS = 7;
  const angle  = -(progress * Math.PI*2) - Math.PI/2;
  const outerA = g.outer.w/2-DS, outerB = g.outer.h/2-DS;
  const innerA = g.inner.w/2+DS, innerB = g.inner.h/2+DS;
  const a = outerA - (outerA-innerA)*lane;
  const b = outerB - (outerB-innerB)*lane;
  return { x: g.cx + Math.cos(angle)*a, y: g.cy + Math.sin(angle)*b };
}

function angleToProgress(px, py, g) {
  const angle = Math.atan2(py-g.cy, px-g.cx);
  const p = -(angle + Math.PI/2) / (Math.PI*2);
  return p < 0 ? p+1 : p;
}

function laneValueFor(px, py, g) {
  const dx = Math.abs(px-g.cx), dy = Math.abs(py-g.cy);
  const on  = Math.max(dx/(g.outer.w/2), dy/(g.outer.h/2));
  const inn = Math.max(dx/(g.inner.w/2), dy/(g.inner.h/2));
  return Math.min(Math.max((on-inn)+0.5, 0.05), 0.95);
}

function inInfield(px, py, g) {
  const f = g.infield;
  return px>=f.x && px<=f.x+f.w && py>=f.y && py<=f.y+f.h;
}

function bullpenHalf(g) {
  const f=g.infield;
  return {x:f.x, y:f.y, w:(f.w-1)/2, h:f.h};
}
function retiredHalf(g) {
  const f=g.infield, hw=(f.w-1)/2;
  return {x:f.x+hw+1, y:f.y, w:hw, h:f.h};
}

function infieldPos(idx, frame) {
  const DS=14, step=DS+4;
  const cols = Math.max(1, Math.floor((frame.w-10)/step));
  return {
    x: frame.x + 8 + (idx%cols)*step + DS/2,
    y: frame.y + 22 + Math.floor(idx/cols)*step + DS/2,
  };
}

function dist(x1,y1,x2,y2) { return Math.hypot(x2-x1, y2-y1); }

// ─── Drawing ─────────────────────────────────────────────────────────────────
function render() {
  if (!W) return;
  ctx.clearRect(0, 0, W, TRACK_H);
  const g = geo();
  drawTrack(g);
  drawStartFinish(g);
  drawInfieldLabels(g);
  drawInfieldDots(g);
  drawTrackDots(g);
}

function drawRing(rect, innerBlur, outerBlur) {
  // Tight bright stroke
  ctx.save();
  ctx.shadowColor = 'rgba(230, 150, 15, 0.90)';
  ctx.shadowBlur  = innerBlur;
  capsulePath(rect);
  ctx.strokeStyle = 'rgba(240, 160, 20, 0.95)';
  ctx.lineWidth   = 1.8;
  ctx.stroke();
  ctx.restore();
  // Wide diffuse glow
  ctx.save();
  ctx.shadowColor = 'rgba(200, 100, 5, 0.35)';
  ctx.shadowBlur  = outerBlur;
  capsulePath(rect);
  ctx.strokeStyle = 'rgba(220, 130, 10, 0.20)';
  ctx.lineWidth   = 1;
  ctx.stroke();
  ctx.restore();
}

function drawTrack(g) {
  ctx.save();
  capsulePath(g.outer);
  ctx.fillStyle = '#0b0907';
  ctx.fill();
  capsulePath(g.inner);
  ctx.fillStyle = '#060508';
  ctx.fill();
  ctx.restore();

  drawRing(g.outer, 20, 52);
  drawRing(g.ring2, 18, 44);
  drawRing(g.inner, 20, 52);
}

function drawStartFinish(g) {
  const topY=g.outer.y, innerTopY=g.inner.y;
  const h=innerTopY-topY, midY=(topY+innerTopY)/2;
  const cx=g.cx;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.fillRect(cx-8, topY, 3, h);
  const cellW=4, rows=Math.max(4,Math.floor(h/cellW)), cellH=h/rows;
  for (let row=0; row<rows; row++)
    for (let col=0; col<2; col++) {
      ctx.fillStyle=(row+col)%2===0?'rgba(255,255,255,0.92)':'rgba(0,0,0,0.92)';
      ctx.fillRect(cx+2+col*cellW, topY+row*cellH, cellW, cellH);
    }
  drawPill('S', cx-24, midY);
  drawPill('F', cx+24, midY);
  ctx.restore();
}

function drawPill(label, cx, cy) {
  ctx.font='700 8px -apple-system,sans-serif';
  const tw=ctx.measureText(label).width;
  const pw=tw+10, ph=17;
  roundRectPath(cx-pw/2, cy-ph/2, pw, ph, ph/2);
  ctx.fillStyle='rgba(240,235,215,0.92)';
  ctx.fill();
  ctx.fillStyle='#0a0808';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, cx, cy+0.5);
}

function drawInfieldLabels(g) {
  const f=g.infield;
  ctx.save();
  ctx.font='500 11px -apple-system,sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('Bullpen', f.x+8, f.y+8);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(f.x+f.w/2, f.y+8, 1, f.h-16);
  ctx.fillStyle='rgba(255,255,255,0.45)';
  ctx.fillText('Retired', f.x+f.w/2+8, f.y+8);
  ctx.restore();
}

function drawInfieldDots(g) {
  const bh=bullpenHalf(g), rh=retiredHalf(g);
  projects.filter(p=>p.lane==='bullpen').slice(0,8).forEach((p,i)=>{
    const isDrag=drag&&drag.id===p.id;
    const pos=isDrag?drag:infieldPos(i,bh);
    drawDot(pos.x, pos.y, 15, p.colorHex, isDrag, false);
  });
  projects.filter(p=>p.lane==='retired').slice(0,8).forEach((p,i)=>{
    const isDrag=drag&&drag.id===p.id;
    const pos=isDrag?drag:infieldPos(i,rh);
    drawDot(pos.x, pos.y, 15, p.colorHex, isDrag, false);
  });
}

function drawTrackDots(g) {
  const racing=projects.filter(p=>p.lane==='racing');
  racing.forEach((p,i)=>{
    const def=racing.length<=1?0.5:0.2+i/(racing.length-1)*0.6;
    const lane=dotLanePos[p.id]!==undefined?dotLanePos[p.id]:def;
    const isDrag=drag&&drag.id===p.id;
    const pos=isDrag?drag:pointOnTrack(p.progress,lane,g);
    drawDot(pos.x, pos.y, 20, p.colorHex, isDrag, true);
  });
}

function drawDot(x, y, diameter, hex, isDragging, outline) {
  const r=(diameter/2)*(isDragging?1.4:1.0);
  ctx.save();
  ctx.shadowColor=hex;
  ctx.shadowBlur=isDragging?28:(outline?20:12);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=hex; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=outline?'rgba(255,255,255,0.90)':'rgba(255,255,255,0.55)';
  ctx.lineWidth=outline?2.5:1.5; ctx.stroke();
  // gloss
  ctx.beginPath(); ctx.arc(x-r*0.22, y-r*0.28, r*0.34, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.30)'; ctx.fill();
  ctx.restore();
}

// ─── Hit testing ─────────────────────────────────────────────────────────────
function findDotAt(px, py) {
  const g=geo();
  const racing=projects.filter(p=>p.lane==='racing');
  const bullpen=projects.filter(p=>p.lane==='bullpen');
  const retired=projects.filter(p=>p.lane==='retired');
  for (let i=0;i<racing.length;i++){
    const p=racing[i], def=racing.length<=1?0.5:0.2+i/(racing.length-1)*0.6;
    const lane=dotLanePos[p.id]!==undefined?dotLanePos[p.id]:def;
    const pos=pointOnTrack(p.progress,lane,g);
    if(dist(px,py,pos.x,pos.y)<22) return {project:p,type:'track',lane};
  }
  const bh=bullpenHalf(g), rh=retiredHalf(g);
  for (let i=0;i<bullpen.length&&i<8;i++){
    const pos=infieldPos(i,bh);
    if(dist(px,py,pos.x,pos.y)<18) return {project:bullpen[i],type:'infield'};
  }
  for (let i=0;i<retired.length&&i<8;i++){
    const pos=infieldPos(i,rh);
    if(dist(px,py,pos.x,pos.y)<18) return {project:retired[i],type:'infield'};
  }
  return null;
}

// ─── Drag ────────────────────────────────────────────────────────────────────
function evPos(e) {
  const rect=canvas.getBoundingClientRect();
  const src=(e.changedTouches||e.touches||[])[0]||e;
  return {x:src.clientX-rect.left, y:src.clientY-rect.top};
}

canvas.addEventListener('mousedown',  onDragStart);
canvas.addEventListener('touchstart', onDragStart, {passive:false});
function onDragStart(e) {
  e.preventDefault();
  const {x,y}=evPos(e), hit=findDotAt(x,y);
  if (!hit) return;
  drag={id:hit.project.id, type:hit.type, x, y};
  canvas.classList.add('dragging'); render();
}

window.addEventListener('mousemove',  onDragMove);
window.addEventListener('touchmove',  onDragMove, {passive:false});
function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  const {x,y}=evPos(e);
  drag.x=x; drag.y=y;
  if (drag.type==='track') {
    const g=geo();
    if (!inInfield(x,y,g)) {
      const p=projects.find(p=>p.id===drag.id);
      if(p){p.progress=angleToProgress(x,y,g); dotLanePos[drag.id]=laneValueFor(x,y,g);}
    }
  }
  render();
}

window.addEventListener('mouseup',  onDragEnd);
window.addEventListener('touchend', onDragEnd);
async function onDragEnd(e) {
  if (!drag) return;
  const {x,y}=evPos(e), id=drag.id, type=drag.type;
  drag=null; canvas.classList.remove('dragging');
  const g=geo(), inside=inInfield(x,y,g);
  if (type==='track') {
    if (inside) await api.patch(id,{lane:x<g.infield.x+g.infield.w/2?'bullpen':'retired'});
    else { dotLanePos[id]=laneValueFor(x,y,g); await api.patch(id,{progress:angleToProgress(x,y,g)}); }
  } else {
    if (!inside) { dotLanePos[id]=laneValueFor(x,y,g); await api.patch(id,{lane:'racing',progress:angleToProgress(x,y,g)}); }
    else await api.patch(id,{lane:x<g.infield.x+g.infield.w/2?'bullpen':'retired'});
  }
  await refresh();
}

// ─── Cards ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function rgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function laneActiveStyle(lane) {
  return {
    bullpen: 'background:rgba(160,35,30,0.60);border-color:rgba(210,65,55,0.75);color:rgb(255,115,105);',
    racing:  'background:rgba(25,115,50,0.55);border-color:rgba(55,170,80,0.72);color:rgb(80,220,115);',
    retired: 'background:rgba(140,95,8,0.58);border-color:rgba(200,148,22,0.75);color:rgb(255,190,52);',
  }[lane] || '';
}

function renderCards() {
  const racing =projects.filter(p=>p.lane==='racing');
  const bullpen=projects.filter(p=>p.lane==='bullpen');
  const retired =projects.filter(p=>p.lane==='retired');

  // Racers
  document.getElementById('racersList').innerHTML = racing.length===0
    ? '<div class="empty-label">No projects racing</div>'
    : racing.map(p=>`
        <div class="racer-row">
          <div class="racer-dot" style="width:20px;height:20px;background:${p.colorHex};box-shadow:0 0 16px ${rgba(p.colorHex,0.85)};border-radius:50%"></div>
          <div class="racer-body">
            <div class="racer-top">
              <span class="racer-name">${esc(p.name)}</span>
              <span class="racer-pct" style="color:${p.colorHex}">${Math.round(p.progress*100)}%</span>
              <span class="racer-chev">›</span>
            </div>
            <div class="prog-bar-bg">
              <div class="prog-bar-fill" style="width:${Math.round(p.progress*100)}%;background:${p.colorHex}"></div>
            </div>
          </div>
        </div>`).join('');

  // Bullpen
  document.getElementById('bullpenList').innerHTML = bullpen.length===0
    ? '<div style="color:rgba(255,255,255,0.22);font-size:13px;padding:8px 14px 12px">Empty</div>'
    : bullpen.map(p=>`
        <div class="side-item">
          <div class="side-dot" style="width:11px;height:11px;background:${p.colorHex};box-shadow:0 0 9px ${rgba(p.colorHex,0.75)}"></div>
          <span class="side-name">${esc(p.name)}</span>
          <span class="side-chev">›</span>
        </div>`).join('');

  // Retired
  document.getElementById('retiredList').innerHTML = retired.length===0
    ? '<div style="color:rgba(255,255,255,0.22);font-size:13px;padding:8px 14px 12px">Empty</div>'
    : retired.map(p=>`
        <div class="side-item">
          <div class="side-dot" style="width:11px;height:11px;background:${p.colorHex};opacity:0.5;box-shadow:0 0 7px ${rgba(p.colorHex,0.55)}"></div>
          <span class="side-name" style="opacity:0.58">${esc(p.name)}</span>
          <span class="side-chev">›</span>
        </div>`).join('');

  // Manage
  const ml=document.getElementById('manageList');
  ml.innerHTML=projects.map(p=>`
    <div class="project-row">
      <div class="row-top">
        <div class="manage-dot" style="width:18px;height:18px;flex-shrink:0;background:${p.colorHex};border-radius:50%;box-shadow:0 0 14px ${rgba(p.colorHex,0.75)}"></div>
        <input class="name-input" value="${esc(p.name)}" data-id="${p.id}" spellcheck="false">
        <button class="delete-btn" data-id="${p.id}">×</button>
      </div>
      <div class="lane-selector">
        ${['bullpen','racing','retired'].map(l=>`
          <button class="lane-btn${p.lane===l?' active':''}" data-id="${p.id}" data-lane="${l}"
            style="${p.lane===l?laneActiveStyle(l):''}">${l.charAt(0).toUpperCase()+l.slice(1)}</button>
        `).join('')}
      </div>
      ${p.lane==='racing'?`
      <div class="prog-row">
        <span class="prog-label">PROGRESS</span>
        <input type="range" class="prog-slider" min="0" max="100" value="${Math.round(p.progress*100)}"
               data-id="${p.id}" style="accent-color:${p.colorHex}">
        <span class="prog-val" style="color:${p.colorHex}">${Math.round(p.progress*100)}%</span>
      </div>`:''}
    </div>`).join('');

  ml.querySelectorAll('.delete-btn').forEach(btn=>
    btn.addEventListener('click', async()=>{await api.del(btn.dataset.id); await refresh();})
  );
  ml.querySelectorAll('.name-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{if(e.key==='Enter') inp.blur();});
    inp.addEventListener('blur', async()=>{await api.patch(inp.dataset.id,{name:inp.value}); await refresh();});
  });
  ml.querySelectorAll('.lane-btn').forEach(btn=>
    btn.addEventListener('click', async()=>{await api.patch(btn.dataset.id,{lane:btn.dataset.lane}); await refresh();})
  );
  ml.querySelectorAll('.prog-slider').forEach(slider=>{
    slider.addEventListener('input', ()=>{
      const pct=parseInt(slider.value);
      const row=slider.closest('.project-row');
      row.querySelector('.prog-val').textContent=pct+'%';
      const p=projects.find(p=>p.id===slider.dataset.id);
      if(p){p.progress=pct/100; render();}
    });
    slider.addEventListener('change', async()=>{
      await api.patch(slider.dataset.id,{progress:parseInt(slider.value)/100});
      await refresh();
    });
  });
}

// ─── Modal ───────────────────────────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click',()=>{
  document.getElementById('addModal').classList.add('visible');
  document.getElementById('newProjectName').focus();
});
document.getElementById('cancelAdd').addEventListener('click', closeModal);
document.getElementById('addModal').addEventListener('click', e=>{
  if(e.target===document.getElementById('addModal')) closeModal();
});
document.getElementById('newProjectName').addEventListener('keydown', e=>{
  if(e.key==='Enter')  document.getElementById('confirmAdd').click();
  if(e.key==='Escape') closeModal();
});
document.getElementById('confirmAdd').addEventListener('click', async()=>{
  const name=document.getElementById('newProjectName').value.trim();
  await api.add(name||'');
  closeModal(); await refresh();
});
function closeModal(){
  document.getElementById('addModal').classList.remove('visible');
  document.getElementById('newProjectName').value='';
}

// ─── Boot ────────────────────────────────────────────────────────────────────
async function refresh(){
  projects=await api.list();
  renderCards(); render();
}

(async()=>{
  await refresh();
  resizeCanvas();
  window.addEventListener('resize',()=>{resizeCanvas(); render();});
})();
</script>
</body>
</html>
